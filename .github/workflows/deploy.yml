name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: 코스 저장소(고정 커밋) 가져오기
        uses: actions/checkout@v4
        with:
          repository: Y-JaeHyun/ebpf-fundamentals-kr
          path: .course-src/ebpf
          fetch-depth: 0
      - name: 코스 저장소(로봇) 가져오기
        uses: actions/checkout@v4
        with:
          repository: Y-JaeHyun/robotics-fundamentals-kr
          path: .course-src/robotics
          fetch-depth: 0
      - name: 출처 검사
        run: npm run check-sources
        env:
          COURSE_SRC_EBPF: .course-src/ebpf
          COURSE_SRC_ROBOTICS: .course-src/robotics
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
