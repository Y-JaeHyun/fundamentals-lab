id: '07'
slug: 07-go-cilium-ebpf
title: 'Go: cilium/ebpf'
summary: bpf2go로 C를 컴파일하고 Go 바인딩을 만든 뒤, 로드·attach·map·ring buffer를 순수 Go로 다뤄요.
questions:
  - id: attach-point
    kind: choice
    prompt: cilium/ebpf에서 counter의 attach 대상을 vfs_write로 바꾸려면, 실제로 attach 지점을 정하는 쪽은 어디일까요?
    options:
      - text: BPF C의 SEC("kprobe/…") 이름
        feedback: cilium/ebpf에서 SEC는 프로그램 타입을 정해요. 붙는 곳은 Go의 link.* 호출이 정해요.
      - text: Go의 link.Kprobe("…") 호출
        correct: true
        feedback: 맞아요. 그래서 03장처럼 SEC("uprobe")같이 대상이 없는 섹션 이름도 쓸 수 있어요.
      - text: bpf2go가 생성한 Go 파일
        feedback: 생성 파일은 프로그램·map·상수를 이름 붙은 필드로 줄 뿐, attach 지점은 정하지 않아요.
    sources:
      - path: chapters/07-go-cilium-ebpf/README.md
  - id: const-volatile
    kind: choice
    prompt: filter_uid를 const volatile 전역 변수로 두고 로드 전에 Set했어요. 이 방식의 장점은?
    code: |
      const volatile u32 filter_uid = (u32)-1;   // BPF 쪽
      spec.Variables["filter_uid"].Set(uint32(*uid)) // Go 쪽: 로드 "전에" 값 설정
    options:
      - text: 로드 후에도 Go에서 언제든 값을 바꿀 수 있다
        feedback: 로드 후에는 커널에서 읽기 전용이 돼요. 값은 로드 전에만 정해요.
      - text: verifier가 값을 상수로 알고 쓰이지 않는 분기를 지워서, 옵션으로 동작을 바꿔도 비용이 거의 없다
        correct: true
        feedback: 맞아요. volatile은 컴파일러가 기본값 -1로 미리 계산해 버리지 않게 막는 역할이에요.
      - text: map 조회보다 빠르게 매 이벤트마다 사용자 공간에서 값을 받아 온다
        feedback: 사용자 공간과 매번 주고받지 않아요. 로드 직전에 .rodata에 넣은 값을 verifier가 상수로 다뤄요.
    sources:
      - path: chapters/07-go-cilium-ebpf/README.md
  - id: shutdown-order
    kind: order
    prompt: execsnoop을 끝낼 때 남은 이벤트를 잃지 않으려면 어떤 순서로 해야 할까요?
    items:
      - tp.Close()로 tracepoint를 먼저 뗀다
      - rd.Flush()를 부른다
      - Read()가 남은 레코드를 마저 돌려준 뒤 ringbuf.ErrFlushed를 반환한다
    feedback: reader부터 닫으면 남은 이벤트를 버리게 되고, attach를 유지한 채 통계를 읽으면 출력한 줄 수와 "전송" 수가 어긋나요.
    sources:
      - path: chapters/07-go-cilium-ebpf/README.md
  - id: percpu-stats
    kind: choice
    prompt: execsnoop 통계 끝에 "CPU 16개 합산"이 붙어 있어요. 왜 합산이 필요할까요?
    log: |
      전송: 4 (CPU 16개 합산)
      버림(ring buffer 가득 참): 0 (CPU 16개 합산)
    options:
      - text: stats가 PERCPU_ARRAY라서 각 CPU가 자기 칸만 쓰고, 읽을 때 CPU 수만큼의 값이 오기 때문에
        correct: true
        feedback: 맞아요. 원자 연산도 캐시 경합도 없어요. Go에서는 Lookup에 슬라이스를 넘겨 받아요.
      - text: ring buffer가 CPU마다 하나씩 있어서
        feedback: 이 예제의 ring buffer는 하나예요. CPU별로 나뉜 건 통계용 PERCPU_ARRAY예요.
      - text: Go가 고루틴을 CPU 수만큼 띄워서
        feedback: 합산 대상은 BPF map의 CPU별 값이에요. 고루틴과는 관계없어요.
    sources:
      - path: chapters/07-go-cilium-ebpf/README.md
  - id: ringbuf-size
    kind: choice
    prompt: ring buffer max_entries를 아무 값(예 5000)으로 정했어요. 어떻게 될까요?
    options:
      - text: 가장 가까운 크기로 커널이 알아서 맞춘다
        feedback: 알아서 맞춰 주지 않아요. 조건에 안 맞으면 map 생성이 실패해요.
      - text: 문제없이 5000바이트 버퍼가 만들어진다
        feedback: ring buffer 크기에는 조건이 있어요. 페이지 크기(4096)의 2의 거듭제곱 배여야 해요.
      - text: 페이지 크기(4096)의 2의 거듭제곱 배가 아니라서 map 생성이 EINVAL로 실패한다
        correct: true
        feedback: 맞아요. 4096, 8192, 16384…처럼 정해요.
    sources:
      - path: chapters/07-go-cilium-ebpf/README.md
run:
  cmd: make -C chapters/07-go-cilium-ebpf/code build run
  expect: |
    === 07-2 execsnoop: 4초 동안 UID 65534(nobody)가 실행하는 프로그램 추적
    전송: 4 (CPU 16개 합산)
    버림(ring buffer 가득 참): 0 (CPU 16개 합산)
  sources:
    - path: chapters/07-go-cilium-ebpf/README.md
