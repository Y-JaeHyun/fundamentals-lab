id: '12'
slug: 12-lsm-bpf
title: LSM-BPF
summary: LSM hook에 BPF를 붙이면 root도 막을 수 있어요. 단, LSM 목록에 bpf가 없으면 붙어도 아무것도 막지 못해요.
questions:
- id: host-no-bpf
  kind: choice
  prompt: LSM 목록에 bpf가 없는 호스트에서 -allow-inactive로 enforce 모드를 돌렸어요. 로드도 attach도 오류가 없었는데 결과가 이래요. 무슨 일일까요?
  log: |
    lockdown,capability,landlock,yama,apparmor,ima,evm
    [성공] secret.txt 읽기
    [성공] blocked-true 실행
  options:
  - text: verifier가 프로그램을 거부해서 로드되지 않았다
    feedback: 로드와 attach는 오류 없이 성공했어요. 문제는 그 다음이에요.
  - text: 프로그램과 link는 만들어졌지만 BPF LSM이 hook에 등록되지 않아 프로그램이 불리지 않았다
    correct: true
    feedback: 맞아요. 정책이 적용된 것처럼 보이는데 실제로는 꺼져 있는, 가장 위험한 실패예요. 그래서 로더가 /sys/kernel/security/lsm을 확인하고 bpf가 없으면 시작을 거부해요(fail closed).
  - text: root로 실행해서 LSM 검사를 건너뛰었다
    feedback: LSM은 DAC 검사 다음 단계라 root에게도 적용돼요. bpf가 켜진 VM에서는 root도 막혔어요.
  sources:
  - path: chapters/12-lsm-bpf/README.md
- id: hardlink-copy
  kind: choice
  prompt: enforce 모드에서 하드링크는 막혔는데, 같은 내용의 복사본은 실행됐어요. 왜일까요?
  log: |
    [실패] 하드링크(secret-hardlink.txt) 읽기 — Operation not permitted
    [실패] blocked-true 실행 — Operation not permitted
    [성공] 복사본(copied-true) 실행
  options:
  - text: 경로 문자열을 비교해서, 복사본 이름이 달라 통과했다
    feedback: 경로로 비교했다면 이름이 다른 하드링크도 통과했을 거예요. 이 예제는 경로를 판단에 쓰지 않아요.
  - text: 복사본 실행은 bprm_check_security hook을 지나지 않는다
    feedback: 실행은 모두 같은 hook을 지나요. 막는 대상과 비교했을 때 달랐을 뿐이에요.
  - text: (장치, inode)로 비교해서, 하드링크는 같은 inode라 막히고 복사본은 다른 inode라 통과했다
    correct: true
    feedback: 맞아요. inode로 고르면 하드링크로는 우회할 수 없지만 복사본은 못 막아요. 해시(IMA)나 xattr 레이블 같은 규칙과 조합해야 해요.
  sources:
  - path: chapters/12-lsm-bpf/README.md
- id: bprm-comm
  kind: choice
  prompt: blocked-true 실행을 막은 이벤트의 COMM이 bash로 찍혔어요. 왜일까요?
  log: |
    bprm_check_security  DENY    244     0      bash         /tmp/tmp.x5MnTm1t06/blocked-true
  options:
  - text: 이 hook은 새 프로그램으로 바뀌기 전에 불려서, 현재 프로세스 이름이 아직 실행을 요청한 셸이다
    correct: true
    feedback: 맞아요. 실행될 파일 이름은 bprm->filename에서 따로 읽어요.
  - text: blocked-true가 내부적으로 bash 스크립트라서
    feedback: blocked-true는 /bin/true의 복사본이에요. 스크립트가 아니에요.
  - text: COMM 필드를 읽는 코드에 버그가 있다
    feedback: 버그가 아니에요. hook이 불리는 시점 때문에 생기는 정상 동작이에요.
  sources:
  - path: chapters/12-lsm-bpf/README.md
- id: ret-arg
  kind: choice
  prompt: 예제의 LSM 프로그램은 이렇게 시작해요. 이 두 줄이 왜 필요할까요?
  code: |
    if (ret)
    return ret; // 이미 거부된 요청은 그대로 둔다
  options:
  - text: 다른 LSM(AppArmor 등)이 거부한 것을 BPF가 허용으로 뒤집지 못하게 하려고
    feedback: 앞선 LSM이 거부하면 그 자리에서 멈춰서 BPF LSM은 불리지도 않아요. ret은 같은 hook에 먼저 붙은 BPF LSM 프로그램의 결과예요.
  - text: 먼저 붙은 BPF LSM 프로그램의 거부를 뒤 프로그램이 0을 돌려 지우지 않게 하려고
    correct: true
    feedback: 맞아요. BPF LSM 프로그램 여러 개는 한 자리 안에서 차례로 불려요. 모두 이 약속을 지켜야 "더 막는 방향"이 성립해요.
  - text: verifier가 ret 인자를 반드시 읽도록 요구해서
    feedback: verifier 요구가 아니에요. 여러 BPF LSM 프로그램이 공존할 때를 위한 약속이에요.
  sources:
  - path: chapters/12-lsm-bpf/README.md
- id: lsm-boot-arg
  kind: choice
  prompt: LSM-BPF를 켜려고 부팅 인자에 lsm=bpf만 넣었어요. 무엇이 문제일까요?
  options:
  - text: 문제없다. bpf만 적으면 기존 목록에 덧붙는다
    feedback: lsm=은 목록을 통째로 바꿔요. 덧붙이지 않아요.
  - text: CONFIG_BPF_LSM=y가 함께 꺼진다
    feedback: CONFIG_BPF_LSM은 커널 빌드 옵션이라 부팅 인자로 바뀌지 않아요.
  - text: 목록을 통째로 바꿔서 AppArmor 같은 기존 LSM이 꺼진다
    correct: true
    feedback: 맞아요. /sys/kernel/security/lsm의 현재 목록에 bpf를 덧붙여야 해요.
  sources:
  - path: chapters/12-lsm-bpf/README.md
run:
  cmd: make -C chapters/12-lsm-bpf/code build run
  expect: |
    lockdown,capability,landlock,yama,apparmor,bpf,ima,evm
    [실패] secret.txt 읽기 — Operation not permitted
    [성공] 복사본(copied-true) 실행
  sources:
  - path: chapters/12-lsm-bpf/README.md
