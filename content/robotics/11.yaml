id: '11'
slug: 11-services-actions
title: 서비스·액션·파라미터
summary: 서비스는 요청 하나에 응답 하나, 액션은 피드백과 취소가 붙어요. 콜백 그룹이 동시성을 정하고, param set은 실패해도 0이에요.
questions:
- id: multi-still-blocked
  kind: choice
  prompt: 서버를 MultiThreadedExecutor(4 스레드)로 바꾸고 /slow(2초) 0.2초 뒤 /fast를 불렀어요. 왜 /fast가 여전히 이렇게 기다렸을까요?
  log: |
    [svc_server] executor=multi groups=default 준비
    [svc_server  2.455s] /slow 시작 (2.0s 걸림)
    [svc_server  4.456s] /slow 끝
    [svc_server  4.457s] /fast 처리
    [client] /fast 보냄 0.204s → 응답 2.197s (대기 1.993s)
  options:
  - text: 스레드 4개가 모두 /slow 콜백 하나를 나눠 처리하느라 바빴다
    feedback: 콜백 하나는 스레드 하나에서 돌아요. 나머지 스레드는 놀고 있었지만 /fast를 시작할 수 없었어요.
  - text: 두 서비스가 노드의 기본 콜백 그룹(MutuallyExclusive) 하나에 들어 있었다
    correct: true
    feedback: 맞아요. 스레드 수가 아니라 콜백 그룹이 동시성을 정해요. 서비스마다 그룹을 나누자 대기가 0.002초가 됐어요.
    log: |
      [client] /fast 보냄 0.207s → 응답 0.209s (대기 0.002s)
  - text: 클라이언트가 /slow 응답을 받기 전에는 /fast 요청을 보내지 않았다
    feedback: 클라이언트는 0.204초에 /fast를 보냈어요. 요청은 일찍 도착했지만 서버가 꺼내지 못했어요.
  - text: Fast DDS가 같은 노드로 가는 요청을 순서대로 하나씩만 전달했다
    feedback: 전달 문제가 아니에요. 그룹을 나눈 실행에서는 같은 DDS로 /fast가 /slow 도중에 처리됐어요.
  sources:
  - path: chapters/11-services-actions/README.md
- id: sync-call-deadlock
  kind: choice
  prompt: 싱글 스레드 실행기의 타이머 콜백 안에서 동기 call()을 했어요. 서버는 응답을 보냈는데 왜 None일까요?
  log: |
    [client] (SingleThreaded) 타이머 콜백 안에서 call(timeout_sec=3.0) → None (3.000s 뒤)
  options:
  - text: 응답을 받아 future를 완료할 스레드가 call()에서 기다리고 있었다
    correct: true
    feedback: 맞아요. 응답 처리도 클라이언트 실행기의 일이에요. 콜백 안에서는 call_async()와 add_done_callback()을 쓰는 게 단순해요.
  - text: 서버가 콜백 안에서 온 요청을 3초 동안 무시했다
    feedback: 서버는 멀쩡히 응답을 보냈어요. 막힌 쪽은 응답을 받아야 할 클라이언트 노드예요.
  - text: 타이머 주기가 3초보다 짧아서 call()이 계속 다시 시작됐다
    feedback: 타이머 때문이 아니에요. 멀티 스레드와 별도 그룹으로 바꾸자 같은 call()이 0.002초 만에 응답을 받았어요.
  sources:
  - path: chapters/11-services-actions/README.md
- id: cancel-order
  kind: order
  prompt: 액션 goal을 실행 도중 취소했어요. 클라이언트가 본 goal 상태를 순서대로 놓아 보세요.
  items:
  - ACCEPTED(1)
  - EXECUTING(2)
  - CANCELING(3)
  - CANCELED(5)
  feedback: 취소는 두 단계예요. cancel_callback이 받아들이면 CANCELING, 실행 루프가 canceled()를 부르면 CANCELED예요. 그래도 결과(delta=-0.60)는 와요.
  sources:
  - path: chapters/11-services-actions/README.md
- id: param-set-exit
  kind: choice
  prompt: on-set 콜백이 거절한 ros2 param set이에요. 스크립트에서 이 실패를 어떻게 알아챌까요?
  log: |
    --- ros2 param set /param_node max_speed 3.0
    [param_node] 거절: max_speed=3.0
    Setting parameter failed: max_speed must be in [0.0, 2.0], got 3.0
    (종료 코드 0)
  options:
  - text: 종료 코드가 0이 아닌지 확인한다
    feedback: 이 실행의 모든 실패가 종료 코드 0이었어요. 서비스 호출만 성공하면 0이에요.
  - text: stderr에 [ERROR]가 찍혔는지 확인한다
    feedback: 거절 문구는 Setting parameter failed 한 줄이에요. 종료 코드로는 알 수 없어서 글자를 봐야 해요.
  - text: 출력에 successful이 있는지 확인한다
    correct: true
    feedback: 맞아요. 성공하면 Set parameter successful이 찍혀요. 실패 여부는 글자로만 알려 줘요.
  sources:
  - path: chapters/11-services-actions/README.md
- id: start-value-loophole
  kind: choice
  prompt: 실행 중에는 3.0을 거절하는 노드인데, 시작할 때 -p max_speed:=5.0을 주자 이렇게 떴어요. 왜 그럴까요?
  log: |
    [param_node] 시작 max_speed=5.0 robot_name=tb1
  options:
  - text: 시작 인자는 문자열로 들어와 범위 검사가 생략됐다
    feedback: 타입은 검사됐어요. 같은 자리에 정수 1을 주면 InvalidParameterTypeException으로 노드가 죽었어요.
  - text: declare_parameter()가 시작값을 읽을 때는 on-set 콜백이 아직 등록 전이었다
    correct: true
    feedback: 맞아요. 콜백을 declare보다 먼저 걸면 같은 5.0이 InvalidParameterValueException으로 거절돼요.
  - text: on-set 콜백은 ros2 param set CLI에서 온 변경만 검사한다
    feedback: 출처를 가리지 않아요. 콜백을 먼저 등록한 실행에서는 시작값 5.0도 거절됐어요.
  sources:
  - path: chapters/11-services-actions/README.md
run:
  cmd: make -C chapters/11-services-actions/code build run
  expect: |
    [client] /fast 보냄 0.207s → 응답 0.209s (대기 0.002s)
    Setting parameter failed: max_speed must be in [0.0, 2.0], got 3.0
  sources:
  - path: chapters/11-services-actions/README.md
