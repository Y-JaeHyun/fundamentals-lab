id: '09'
slug: 09-ros2-topics
title: ROS2 노드와 토픽
summary: 노드는 이름 붙은 토픽으로 메시지를 주고받아요. 타입이 다르면 경고 없이 0개가 되니 topic list -t로 확인해요.
questions:
- id: type-mismatch
  kind: choice
  prompt: 같은 토픽 /mixed에 String 발행자와 Int32 구독자를 띄웠더니 이렇게 나왔어요. stderr에는 무엇이 찍혔을까요?
  log: |
    [string_pub] mixed (std_msgs/msg/String) 보냄 150
    [int32_sub] mixed (std_msgs/msg/Int32) 받음 0
  options:
  - text: Incompatible type 경고가 구독자 쪽에 한 번 찍혔다
    feedback: rclpy에 그런 기본 경고 콜백이 있긴 해요. 하지만 이 실행에서 Fast DDS는 그 이벤트를 올리지 않았어요.
  - text: 메시지마다 역직렬화 실패 에러가 찍혔다
    feedback: 타입 이름이 다른 끝점끼리는 아예 짝이 지어지지 않아요. 잘못된 바이트가 들어와 해석이 깨지는 일은 없어요.
  - text: 아무것도 찍히지 않았다. Fast DDS와 Cyclone DDS 모두 그랬다
    correct: true
    feedback: 맞아요. 타입 불일치는 조용히 0개예요. 10장의 QoS 불일치가 [WARN]을 남기는 것과 대조적이에요.
  - text: QoS 불일치 경고가 RELIABILITY 정책으로 찍혔다
    feedback: 그건 10장의 QoS 불일치 경고예요. 여기선 QoS가 같고 타입만 달라요.
  sources:
  - path: chapters/09-ros2-topics/README.md
- id: list-t-clue
  kind: choice
  prompt: 경고가 없으니 그래프 정보에서 단서를 찾아야 해요. ros2 topic list -t에서 무엇이 이상할까요?
  log: |
    /mixed [std_msgs/msg/Int32, std_msgs/msg/String]
    /parameter_events [rcl_interfaces/msg/ParameterEvent]
    /rosout [rcl_interfaces/msg/Log]
  options:
  - text: /parameter_events와 /rosout은 아무도 만들지 않은 수상한 토픽이다
    feedback: 둘은 모든 노드가 기본으로 만드는 토픽이에요(파라미터 변경 알림, 로그). 정상이에요.
  - text: /mixed 한 토픽에 타입이 두 개 붙어 있다
    correct: true
    feedback: 맞아요. 한 토픽에 타입이 두 개 이상이면 거의 항상 버그예요. info -v로 끝점별 Topic type을 보면 누가 다른지 알 수 있어요.
  - text: /mixed에 발행자 수가 표시되지 않았다
    feedback: list -t는 원래 이름과 타입만 보여 줘요. 개수는 ros2 topic info로 봐요.
  sources:
  - path: chapters/09-ros2-topics/README.md
- id: echo-refuse
  kind: choice
  prompt: 타입을 주지 않고 ros2 topic echo /mixed --once를 실행했더니 이렇게 끝났어요. 어떻게 하면 받을 수 있을까요?
  log: |
    Cannot echo topic '/mixed', as it contains more than one type: [std_msgs/msg/Int32, std_msgs/msg/String]
    (종료 코드 1)
  options:
  - text: --once를 빼고 계속 기다린다
    feedback: --once 때문이 아니에요. echo가 어느 타입으로 구독할지 추론할 수 없어서 바로 끝났어요.
  - text: RMW를 Cyclone DDS로 바꾼다
    feedback: 9-3에서 Cyclone DDS로 바꿔도 /mixed는 여전히 타입이 두 개였어요. 문제는 RMW가 아니에요.
  - text: 타입을 지정해 ros2 topic echo /mixed std_msgs/msg/String --once로 실행한다
    correct: true
    feedback: 맞아요. 타입을 명시하면 그 타입 끝점과만 이어져 정상으로 받아요. 종료 코드도 0이었어요.
    log: |
      data: hello 91
      (종료 코드 0)
  sources:
  - path: chapters/09-ros2-topics/README.md
- id: count-not-connection
  kind: choice
  prompt: 9-2에서 ros2 topic info /mixed가 Publisher count 1, Subscription count 2를 보였어요. 실제로 이어진 발행-구독 쌍은 몇 개일까요?
  options:
  - text: 두 쌍. 구독자 두 개가 모두 발행자와 이어졌다
    feedback: int32_sub는 타입이 달라 0개를 받았어요. 개수만으로는 연결 여부를 알 수 없어요.
  - text: 한 쌍. 개수는 같은 이름의 끝점 수일 뿐이다
    correct: true
    feedback: 맞아요. string_sub만 150개를 받았어요. -v로 끝점별 타입을 보세요.
  - text: 0쌍. 타입이 섞인 토픽은 전부 끊긴다
    feedback: 같은 타입인 string_sub는 150개를 모두 받았어요. 발행자 문제가 아니라는 뜻이에요.
  sources:
  - path: chapters/09-ros2-topics/README.md
- id: echo-late
  kind: choice
  prompt: 10Hz로 200개를 보내는 중에 ros2 topic echo /chatter --once를 실행했어요. 왜 hello 0이 아니라 이 메시지를 받았을까요?
  log: |
    data: hello 112
  options:
  - text: echo도 실행한 순간부터 구독하는 노드라 그 전 메시지는 받지 못해서
    correct: true
    feedback: 맞아요. 기본 QoS(VOLATILE)에서는 실행한 뒤 들어온 메시지만 보여요. 과거 메시지 이야기는 10장에서 다뤄요.
  - text: 앞의 메시지 112개가 네트워크에서 손실돼서
    feedback: listener는 200개를 모두 받았어요. 같은 컨테이너 안이라 잃을 일이 거의 없었어요.
  - text: echo가 depth 10 큐에서 가장 오래된 것을 골라서
    feedback: echo는 과거 메시지를 큐에서 꺼내 보여 주지 않아요. 실행 이후 들어온 것만 받아요.
  sources:
  - path: chapters/09-ros2-topics/README.md
run:
  cmd: make -C chapters/09-ros2-topics/code build run
  expect: |
    [listener] chatter (std_msgs/msg/String) 받음 200
    [int32_sub] mixed (std_msgs/msg/Int32) 받음 0
  sources:
  - path: chapters/09-ros2-topics/README.md
